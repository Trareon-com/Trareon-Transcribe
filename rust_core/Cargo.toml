[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Trareon Transcribe Rust engine — audio capture, VAD, STT, export"
autobins = false

[lib]
name = "rust_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "wer_bench"
path = "src/bin/wer_bench.rs"

# Live-path measurement: commit latency and live coverage, old chunking
# policy vs LocalAgreement-2.
[[bin]]
name = "live_bench"
path = "src/bin/live_bench.rs"

[[bin]]
name = "trareon-transcribe"
path = "src/bin/transcribe.rs"

[[bin]]
name = "transcribe_cli"
path = "src/bin/transcribe_cli.rs"

[[bin]]
name = "device_probe"
path = "src/bin/device_probe.rs"

[[bin]]
name = "dual_capture_probe"
path = "src/bin/dual_capture_probe.rs"

[[bin]]
name = "poll_probe"
path = "src/bin/poll_probe.rs"

[[bin]]
name = "session_start_probe"
path = "src/bin/session_start_probe.rs"

[[bin]]
name = "complete_probe"
path = "src/bin/complete_probe.rs"

[dependencies]
thiserror = "2"
# Text compression-ratio signal (B2): a decoder loop compresses far better
# than real sentences do. Was dev-only (used by wer_bench's fixtures);
# promoted to a real dependency now that confidence.rs uses it in the
# actual pipeline, not just in tests.
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
cpal = "0.15"
rubato = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "flac", "vorbis", "wav", "opt-simd"] }
webrtc-vad = "0.4"
sha2 = "0.10"
hex = "0.4"
hound = "3"
strsim = "0.11"
# Local full-text index over every session (F12 "Tanya arsip rapat").
# `bundled` compiles SQLite from the amalgamation rather than linking the
# system one: the feature needs FTS5, and whether a distro's libsqlite3
# was built with it is not something an offline desktop app can check at
# install time.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "json"] }
futures-util = "0.3"
bytes = "1"
dirs = "5"
docx-rs = { version = "0.4.22", default-features = false }
# "Ekspor Log Diagnostik" packs the rotated logs plus the doctor report into a
# single .zip. Same version/features docx-rs already pulls in, so this adds no
# new code to the dependency tree.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
clap = { version = "4.6.4", features = ["derive"] }
glob = "0.3.4"
sysinfo = "0.39.6"
flutter_rust_bridge = "=2.13.0"
whisper-rs = "0.16"
printpdf = { version = "0.12.8", default-features = false }
pdf-extract = "0.12"
nnnoiseless = { version = "0.5.2", default-features = false }
# Offline speaker diarization. Optional — see the `neural-diarization`
# feature below for why it is not a default dependency.
sherpa-onnx = { version = "1.13.8", optional = true, default-features = false, features = ["shared"] }

[features]
# Deliberately empty. `silero-onnx` used to be here; Sprint 4b replaced the
# `ort`-backed Silero VAD with whisper.cpp's own (see
# src/vad/whisper_silero.rs), which needs no second ONNX runtime and has a
# model the app can actually download. Leaving `ort` in the default set
# cost every build a ~100 MB prebuilt download for a code path that, in
# practice, no install ever reached: nothing shipped
# `models/silero_vad.onnx`, so every `SileroDetector` fell back to the RMS
# energy detector.
default = []
# Silero VAD via the `ort` ONNX Runtime. Still here for anyone who has an
# ONNX Silero model on disk, but it is no longer the gate the app relies
# on. Cannot be combined with `neural-diarization` — see below.
silero-onnx = ["dep:ort"]
pyannote = []  # Enable pyannote.audio Python integration for neural diarization
gpu-vulkan = ["whisper-rs/vulkan"]  # Enable cross-vendor GPU acceleration via Vulkan (NVIDIA/AMD/Intel)
# "Pemisahan pembicara akurat": sherpa-onnx offline diarization
# (pyannote segmentation 3.0 + 3D-Speaker CAM++).
#
# Off by default on purpose. `sherpa-onnx-sys`'s build script downloads a
# prebuilt static library from GitHub Releases *at build time* — 23 MB for
# linux-x64, 123 MB for win-x64 — so making it mandatory would put GitHub
# availability in the path of `cargo test` for every contributor. Linux CI
# builds it; macOS and Windows status is tracked in
# docs/NEURAL-DIARIZATION.md.
#
# MUTUALLY EXCLUSIVE with `silero-onnx`: both crates statically link their
# own copy of ONNX Runtime, and enabling both makes the linker reject the
# binary with several hundred duplicate-symbol errors. `src/lib.rs` turns
# that into one readable `compile_error!`.
neural-diarization = ["dep:sherpa-onnx"]

# OpenMP hanya untuk Linux — macOS GitHub Actions runner tidak punya libomp
[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies.whisper-rs]
version = "0.16"
features = ["openmp"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# B8 (Sprint 12): whisper-rs/whisper.cpp's Metal and CoreML backends exist
# and are real crate features, but nothing in this file enabled either —
# so `EngineOptions { use_gpu: true, .. }` on macOS asked whisper.cpp to
# use a GPU backend that was never compiled in, which `stt::best_backend()`
# "coreml"/"metal" naming only *describes*, it does not enable. `metal`
# accelerates general ops; `coreml` additionally offloads the encoder to
# the Neural Engine on Apple Silicon when whisper.cpp finds a matching
# `.mlmodelc` next to the ggml model — the two are complementary, not
# alternatives, so both are enabled together rather than switched on
# `best_backend()`'s per-chip guess.
#
# NOT verified on real Apple Silicon hardware — this sprint ran on Linux.
# See "PERLU VERIFIKASI DI MAC" in docs/SPRINT-REPORTS.md.
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
features = ["metal", "coreml"]

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "8"

# ONNX Runtime prebuilt binaries tidak tersedia untuk macOS Intel (x86_64).
# ort hanya di-build di platform yang didukung; macOS Intel memakai fallback energy VAD.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }

# Linux: fallback to ffmpeg/parec — PipeWire native can be added later
# when libpipewire-0.3-dev is available in the build environment

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Devices_Properties",
    "Win32_System_Com",
]}
# Used only by audio/loopback.rs's WASAPI capture: unlike windows-sys, this
# generates ergonomic method-call bindings for COM interfaces (needed for
# client.Start(), cc.GetBuffer(), etc. — windows-sys only exposes raw
# *mut c_void pointers with no vtable dispatch).
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
]}

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[profile.release]
opt-level = 3
lto = true
strip = true
