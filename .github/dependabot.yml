version: 2

updates:
  # Why this file exists: every pinned action in .github/workflows went two
  # to three majors stale before anyone noticed, and the only symptom was a
  # "Node.js 20 is deprecated" warning on each run — easy to scroll past
  # until the runtime is removed and CI stops working. Weekly PRs make the
  # drift visible while it is still a one-line bump.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR a week for the whole set, rather than five. The actions here
      # are bumped together anyway and share one CI run.
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Rust: a new advisory fixed by a lockfile bump (e.g. url 2.5.9) used to need
  # a manual `cargo update`. Weekly grouped PRs keep the lockfile current.
  - package-ecosystem: cargo
    directory: "/rust_core"
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Dart/Flutter packages. Majors are left to manual review (they usually
  # touch generated FRB bindings or platform plugins).
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
