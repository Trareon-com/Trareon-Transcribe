name: Test builds

# Beta builds for the owner to try on a MacBook and a Windows laptop. These
# are NOT a public release: every output lands as a *workflow artifact* with a
# 30 day retention, never as a GitHub Release. The one public release happens
# from `release.yml`, on a `v*` tag, when everything is complete and accurate.
#
# Download instructions, first-open steps per platform, and the test checklist
# live in docs/TESTING-ON-MAC-WINDOWS.md.
on:
  workflow_dispatch:
    inputs:
      bundle_models:
        description: >-
          Bundle the speech models into the artifacts. Off keeps the downloads
          small (the app fetches models on first run); on produces a build that
          works with no network at all.
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# Runner images and action versions are pinned to exactly what ci.yml uses, so
# a beta that builds here is a beta that would build on a release tag.
env:
  # Artifact names carry this instead of a tag.
  BUILD_LABEL: ${{ github.sha }}

jobs:
  macos:
    name: macOS arm64 DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Resolve version
        id: version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "value=${v}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download bundled models
        if: inputs.bundle_models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      - name: Build and ad-hoc sign the DMG
        env:
          # Empty: package_macos.sh falls back to `codesign --sign -`, which is
          # an ad-hoc signature. A beta is not notarized, so macOS quarantines
          # it on first open. docs/TESTING-ON-MAC-WINDOWS.md says how to get
          # past that.
          MACOS_SIGN_IDENTITY: ''
        run: bash scripts/package_macos.sh "${{ steps.version.outputs.value }}"

      - name: Verify the signature is at least ad-hoc
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Trareon Transcribe.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: beta-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows portable ZIP and installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Resolve version
        id: version
        shell: bash
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "value=${v}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download bundled models
        if: inputs.bundle_models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "models\ggml-base.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile "models\ggml-large-v3-turbo-q5_0.bin"

      - name: Build the portable ZIP
        run: >-
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1
          -Version "${{ steps.version.outputs.value }}"

      - name: Build the installer
        run: >-
          powershell -ExecutionPolicy Bypass
          -File scripts/package_windows_installer.ps1
          -Version "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: beta-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage and .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libxkbcommon-dev libegl1-mesa-dev \
            libpulse-dev libpcaudio-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libappindicator3-dev \
            dpkg-dev fakeroot desktop-file-utils

      - name: Install appimagetool
        run: |
          curl -fL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Resolve version
        id: version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "value=${v}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download bundled models
        if: inputs.bundle_models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      - name: Build the AppImage
        env:
          # No FUSE on the runner, so appimagetool has to unpack its own
          # runtime instead of mounting it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x scripts/package_linux.sh
          bash scripts/package_linux.sh "${{ steps.version.outputs.value }}"

      - name: Build the .deb
        run: |
          chmod +x scripts/package_deb.sh
          bash scripts/package_deb.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: beta-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA256SUMS
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: collected
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd collected
          # The per-platform .sha256 files from the packaging scripts would end
          # up inside the manifest checksumming themselves.
          rm -f ./*.sha256 SHA256SUMS.txt
          # Sorted, so the manifest is reproducible regardless of the order the
          # artifacts were downloaded in.
          find . -maxdepth 1 -type f -printf '%P\n' | LC_ALL=C sort > /tmp/files
          test -s /tmp/files
          xargs -a /tmp/files sha256sum > SHA256SUMS.txt
          echo "==> SHA256SUMS.txt covers $(wc -l < SHA256SUMS.txt) artifact(s):"
          cat SHA256SUMS.txt
          # Fails the run if any listed digest does not match.
          sha256sum --check --strict SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: beta-SHA256SUMS
          path: collected/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
