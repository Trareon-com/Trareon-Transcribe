name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-release:
    name: Build and publish source release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Create source archive
        run: |
          git archive --format=tar.gz --output="transcribe-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"

      - name: Generate checksum
        run: sha256sum "transcribe-${GITHUB_REF_NAME}.tar.gz" > "transcribe-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Upload source archive
        uses: softprops/action-gh-release@v3
        with:
          files: |
            transcribe-${{ github.ref_name }}.tar.gz
            transcribe-${{ github.ref_name }}.tar.gz.sha256

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Download bundled models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      - name: Build macOS DMG
        run: |
          bash scripts/package_macos.sh "${GITHUB_REF_NAME#v}"

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  build-linux:
    name: Build Linux tar.gz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libxkbcommon-dev libegl1-mesa-dev \
            libpulse-dev libpcaudio-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libappindicator3-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Download bundled models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      - name: Build Linux tar.gz
        run: |
          chmod +x scripts/package_linux.sh
          bash scripts/package_linux.sh "${GITHUB_REF_NAME#v}"

      - name: Upload Linux archive
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  build-windows:
    name: Build Windows ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust_core

      - name: Download bundled models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "models\ggml-base.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile "models\ggml-large-v3-turbo-q5_0.bin"

      - name: Build Windows ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -Version "${GITHUB_REF_NAME#v}"

      - name: Upload ZIP
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
