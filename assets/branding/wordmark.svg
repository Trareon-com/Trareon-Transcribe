<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Trareon mark on its own: the four waveform bars without the speech-mark
  tile. Used for the system tray, where the glyph has to read at 16-22 px over
  a tray that may be light or dark, and for the in-app brand row next to the
  wordmark text.

  Drawn in brand teal #1E8A79 (accent-500), which is the one step on the ramp
  that clears 3:1 against both a white and a near-black tray background.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Trareon">
  <title>Trareon</title>
  <g fill="#1E8A79">
    <rect x="152" y="392" width="112" height="240" rx="56"/>
    <rect x="344" y="232" width="112" height="560" rx="56"/>
    <rect x="536" y="312" width="112" height="400" rx="56"/>
    <rect x="728" y="152" width="112" height="720" rx="56"/>
  </g>
</svg>
