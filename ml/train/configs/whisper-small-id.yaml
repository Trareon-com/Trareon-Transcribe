# Mid model. Measured on the maintainer's CPU, ggml-small runs at 0.37x
# real time, so this is not a live-preview model on weak hardware - it is
# for machines that can afford it and for the post-meeting transcript.
name: whisper-small-id
base_model: openai/whisper-small
language: indonesian
task: transcribe

train_sets:
  - data/shards/mk
  - data/shards/dpr
eval_sets:
  - data/fleurs-id

fp16: true
load_in_4bit: false
gradient_checkpointing: true
per_device_batch_size: 2
gradient_accumulation_steps: 8   # effective batch 16

max_clip_secs: 25.0
min_anchor_rate: 0.7

lora_r: 32
lora_alpha: 64
target_modules: [q_proj, v_proj]
encoder_top_layers: 0

spec_augment: true
learning_rate: 1.0e-3
warmup_steps: 50
max_steps: 2000
optim: adamw_bnb_8bit
output_dir: out/train/whisper-small-id
